<main class="page-shell">
  <a class="back-link" routerLink="/users">Back to users</a>

  <header class="page-header">
    <p class="eyebrow">PEOPLE / DIRECTORY / NEW</p>
    <h1>Add user</h1>
    <p class="intro">Create a contact record for your organization.</p>
  </header>

  <form class="form-panel" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-heading">
      <div>
        <h2>User information</h2>
        <p>A user ID will be assigned automatically. All fields are required.</p>
      </div>
      <span class="required-note"><span aria-hidden="true">*</span> Required</span>
    </div>

    <div class="form-grid">
      <label class="field">
        <span>Full name <span class="required" aria-hidden="true">*</span></span>
        <input formControlName="name" type="text" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small class="field-error">Name is required.</small>
        }
      </label>

      <label class="field">
        <span>Email address <span class="required" aria-hidden="true">*</span></span>
        <input formControlName="email" type="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>Phone <span class="required" aria-hidden="true">*</span></span>
        <input formControlName="phone" type="tel" autocomplete="tel" />
        @if (form.controls.phone.touched && form.controls.phone.invalid) {
          <small class="field-error">Phone is required.</small>
        }
      </label>

      <label class="field">
        <span>City <span class="required" aria-hidden="true">*</span></span>
        <input formControlName="city" type="text" autocomplete="address-level2" />
        @if (form.controls.city.touched && form.controls.city.invalid) {
          <small class="field-error">City is required.</small>
        }
      </label>

      <label class="field field-wide">
        <span>Department <span class="required" aria-hidden="true">*</span></span>
        <input formControlName="department" type="text" />
        @if (form.controls.department.touched && form.controls.department.invalid) {
          <small class="field-error">Department is required.</small>
        }
      </label>
    </div>

    @if (errorMessage) {
      <p class="form-error" role="alert">{{ errorMessage }}</p>
    }

    <div class="form-actions">
      <a class="cancel-button" routerLink="/users">Cancel</a>
      <button class="save-button" type="submit" [disabled]="saving">
        {{ saving ? 'Adding...' : 'Add user' }}
      </button>
    </div>
  </form>
</main>
